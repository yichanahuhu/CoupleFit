name: CoupleFit

options:
  bundleIdPrefix: com.couplefit
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 1 = iPhone，2 = iPad。"1,2" 表示通用。
    # 使用场景：一方用 iPhone，另一方用 iPad mini 6。
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: "YES"
    CLANG_ENABLE_MODULES: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    # 保持 Swift 5 的宽松并发检查。若改用 Swift 6 language mode，
    # 大量 @MainActor 跨界调用会从警告升级为错误，需要逐个标注 Sendable。
    SWIFT_STRICT_CONCURRENCY: "minimal"
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  CoupleFit:
    type: application
    platform: iOS
    sources:
      - path: CoupleFit
        excludes:
          - "**/Resources/Info.plist"
          - "**/Resources/*.entitlements"
          - "**/Resources/GoogleService-Info.plist"
          - "**/*.md"
    info:
      path: CoupleFit/Resources/Info.plist
    # 默认使用「免费 Apple ID」专用 entitlements：
    # 移除了 aps-environment 与 applesignin —— 免费账号不支持这两项 capability，
    # 留着会导致签名失败、App 装不上（不是功能缺失，是装不了）。
    #
    # 若你购买了 Apple Developer Program（$99/年），把下面这行换成
    #   path: CoupleFit/Resources/CoupleFit.entitlements
    # 即可恢复远程推送与 Sign in with Apple。
    entitlements:
      path: CoupleFit/Resources/CoupleFit-Free.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couplefit.app
        PRODUCT_NAME: CoupleFit
        CODE_SIGN_STYLE: Automatic
        # 打包前替换成你自己的 Apple Developer Team ID
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: CoupleFit/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: $(SDKROOT)/usr/lib/swift
