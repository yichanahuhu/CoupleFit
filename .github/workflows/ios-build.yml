name: iOS Build Check

# 在云端 macOS 上完成两件事：
#   1. 验证代码能否编译通过（默认，快）
#   2. 可选：打包出「未签名 ipa」（手动触发时勾选）
#
# 第 2 项是给没有 Mac 的用户准备的：拿到 ipa 后，
# 在 Windows 上用 Sideloadly / AltStore 配合免费 Apple ID 即可签名并安装到 iPhone，
# 全程不需要 Mac。详见 README 第五节「方案 C」。
#
# 费用提示：
#   - 公开仓库：macOS runner 完全免费
#   - 私有仓库：消耗额度，macOS 按 10 倍计费（免费 2000 分钟 ≈ 200 分钟 macOS）
#     建议先用公开仓库跑通，或触发方式保持手动（workflow_dispatch）

on:
  push:
    branches: [main, master]
  pull_request:
  # 允许在 GitHub 网页上手动点「Run workflow」，避免每次 push 都烧额度
  workflow_dispatch:
    inputs:
      build_ipa:
        description: 同时打包未签名 ipa（用于电脑端签名安装到真机）
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译验证 (iOS Simulator)
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          echo "--- Xcode ---"
          xcodebuild -version
          echo "--- Swift ---"
          swift --version
          echo "--- 可用 iOS 模拟器 SDK ---"
          xcodebuild -showsdks | grep -i "ios" || true

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      # 只缓存 SPM 源码缓存，不缓存 DerivedData（Firebase 编译产物可达数 GB，
      # 超过 GitHub 10GB 缓存限额且命中率低）
      - name: 缓存 Swift Package 依赖
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: 编译
        run: |
          set -o pipefail
          xcodebuild \
            -scheme CoupleFit \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # 编译失败时，把 error 行单独拎出来，省得在几千行日志里翻
      - name: 汇总编译错误
        if: failure()
        run: |
          echo "============ 编译错误（前 60 条）============"
          grep -E "error:" build.log | head -60 || echo "未匹配到 error 行，请查看原始日志"
          echo "==========================================="
          echo "提示：完整的错误上下文在 build.log 中，"
          echo "     可从本页右上角的 Artifacts 下载 build-log"

      # 产出未签名 ipa。签名交给 Windows 上的 Sideloadly / AltStore，
      # 因此这里必须完全关闭签名，否则 ipa 里会残留无效签名导致重签失败。
      - name: 打包未签名 ipa
        if: ${{ github.event.inputs.build_ipa == 'true' }}
        run: |
          set -o pipefail
          rm -rf build Payload

          xcodebuild \
            -scheme CoupleFit \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CoupleFit.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee archive.log

          APP=build/CoupleFit.xcarchive/Products/Applications/CoupleFit.app
          if [ ! -d "$APP" ]; then
            echo "::error::未找到编译产物 $APP"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr CoupleFit-unsigned.ipa Payload
          rm -rf Payload

          echo "ipa 大小：$(du -h CoupleFit-unsigned.ipa | cut -f1)"

      - name: 上传未签名 ipa
        if: ${{ github.event.inputs.build_ipa == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: CoupleFit-unsigned-ipa
          path: CoupleFit-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            archive.log
          if-no-files-found: ignore
          retention-days: 7
